name = "stacks_project"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ReasLib", "stacks_project"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
weak.linter.mathlibStandardSet = true
weak.linter.style.longLine = false
weak.linter.style.emptyLine = false
weak.linter.style.cdot = false
weak.linter.style.maxHeartbeats = false
weak.linter.unnecessarySimpa = false

# Keep these dependency pins aligned with `lean-toolchain`.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[require]]
name = "check_recall_tag"
git = "https://github.com/imathwy/check_recall_tag.git"
rev = "32f364c5c74fda7630e14d3593ff2e7a5319adee"

# Shared mathematical infrastructure lives in its own library target and remains independent of
# `stacks_project.Chap*`; chapter modules consume it through one-way compatibility imports.
[[lean_lib]]
name = "ReasLib"
roots = ["ReasLib"]
globs = ["ReasLib.*"]

# Textbook chapter entry points remain in the project library.
# The glob is `stacks_project.+` (submodules only), not `stacks_project.*`: in Lake `X.*`
# selects X itself as well, and there is no `stacks_project.lean` root module, so its
# input job failed on every build. Lake swallows that one error into
# "stacks_project: some modules have bad imports" and exits 1 even when all 46k modules
# compile, which made `lake build`'s exit status useless for verification runs
# (diagnosed 2026-10-28 from repair15 round 1: rc=1, zero failing modules).
[[lean_lib]]
name = "stacks_project"
roots = ["stacks_project"]
globs = ["stacks_project.+"]

[[lean_lib]]
name = "stacks"
