name = "stacks_project"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ReasLib", "stacks_project"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
weak.linter.mathlibStandardSet = true
weak.linter.style.longLine = false
weak.linter.style.emptyLine = false
weak.linter.style.cdot = false
weak.linter.style.maxHeartbeats = false
weak.linter.unnecessarySimpa = false

# Keep these dependency pins aligned with `lean-toolchain`.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[require]]
name = "check_recall_tag"
git = "https://github.com/imathwy/check_recall_tag.git"
rev = "32f364c5c74fda7630e14d3593ff2e7a5319adee"

# Shared mathematical infrastructure lives in its own library target and remains independent of
# `stacks_project.Chap*`; chapter modules consume it through one-way compatibility imports.
[[lean_lib]]
name = "ReasLib"
roots = ["ReasLib"]
globs = ["ReasLib.*"]

# Textbook chapter entry points remain in the project library.
[[lean_lib]]
name = "stacks_project"
roots = ["stacks_project"]
globs = ["stacks_project.*"]

[[lean_lib]]
name = "stacks"

[[lean_lib]]
name = "M2FQualityAudits"
