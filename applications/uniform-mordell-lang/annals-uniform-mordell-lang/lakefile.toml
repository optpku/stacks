name = "AnnalsChallenge"
version = "1.0.0"
keywords = ["math"]
defaultTargets = ["AnnalsChallenge", "UniformMordellLangChecks"]
lintDriver = "batteries/runLinter"

[leanOptions]
# Compatibility for ReasLib definitions elaborated before Lean 4.33.
backward.defeqAttrib.useBackward = true
backward.isDefEq.respectTransparency = false
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
# Switch off warnings generated by `sorry`
warn.sorry = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "d1ddae43a4db43e0acf2d9d9e18b54037dbe3ea0"

[[require]]
name = "JacobianFoundations"
path = "../jacobian-foundations"

[[lean_lib]]
name = "AnnalsChallenge"

[[lean_lib]]
name = "UniformMordellLangChecks"
