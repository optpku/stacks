name = "JacobianFoundations"
version = "0.1.0"
defaultTargets = ["JacobianFoundations"]

[leanOptions]
# Compatibility for ReasLib definitions elaborated before Lean 4.33.
backward.defeqAttrib.useBackward = true
backward.isDefEq.respectTransparency = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
warn.sorry = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "d1ddae43a4db43e0acf2d9d9e18b54037dbe3ea0"

[[lean_lib]]
name = "ReasLib"
roots = []
# No ReasLib.lean root is bundled; build the submodules only.
globs = ["ReasLib.+"]

[[lean_lib]]
name = "JacobianFoundations"
