name = "JacobianFoundations"
version = "0.1.0"
defaultTargets = ["JacobianFoundations"]

[leanOptions]
# Elaborator compatibility for the existing categorical ReasLib interfaces.
backward.defeqAttrib.useBackward = true
backward.isDefEq.respectTransparency = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
warn.sorry = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "ReasLib"
roots = []
# No ReasLib.lean root is bundled; build the submodules only.
globs = ["ReasLib.+"]

[[lean_lib]]
name = "JacobianFoundations"
